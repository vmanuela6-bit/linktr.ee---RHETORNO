<style>
  :root{--blue:#3880f0;--blue-soft:#a9c1e8;--text:#f4f7ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:#050a1c}
  body{font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}

  /* fundo azul-marinho, como na apresentação */
  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 70% 45% at 50% 18%,rgba(56,128,240,.22),transparent 70%),
      radial-gradient(ellipse 90% 50% at 50% 100%,rgba(30,50,130,.35),transparent 70%),
      linear-gradient(180deg,#0a1130 0%,#070d24 55%,#030810 100%);
  }
  #dot{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;display:block}

  .page{
    position:relative;z-index:1;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(36px,7vh,72px) 22px calc(26px + env(safe-area-inset-bottom));
  }
  main{width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center;flex:1}

  /* logo grande */
  .logo{
    --g:0;
    width:clamp(150px,46vw,200px);aspect-ratio:204/250;display:block;
    animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  .logo img{
    width:100%;height:100%;display:block;
    filter:drop-shadow(0 0 calc(4px + 26px*var(--g)) rgba(110,165,255,calc(.9*var(--g))));
  }

  h1{
    margin-top:18px;font-family:'Epilogue','Geist',system-ui,sans-serif;font-size:clamp(30px,8.6vw,36px);font-weight:800;letter-spacing:-.01em;line-height:1;text-transform:uppercase;
    animation:rise .8s .1s cubic-bezier(.2,.7,.2,1) both;
  }
  .tag{
    margin-top:10px;text-align:center;font-size:15.5px;line-height:1.4;color:var(--blue-soft);font-weight:400;
    max-width:300px;text-wrap:balance;animation:rise .8s .18s cubic-bezier(.2,.7,.2,1) both;
  }
  .tag em{font-style:normal;color:#fff}

  .socials{
    margin-top:22px;display:flex;gap:24px;align-items:center;justify-content:center;
    animation:rise .8s .26s cubic-bezier(.2,.7,.2,1) both;
  }
  .socials a{display:grid;place-items:center;width:38px;height:38px;color:#fff;border-radius:50%;
    transition:transform .28s cubic-bezier(.2,.7,.2,1),filter .28s,color .28s;-webkit-tap-highlight-color:transparent}
  .socials svg{width:26px;height:26px;fill:currentColor;display:block}
  .socials a:hover,.socials a:focus-visible{transform:translateY(-3px) scale(1.1);color:#d3e3ff;filter:drop-shadow(0 0 10px rgba(56,128,240,.9));outline:none}

  .links{width:100%;margin-top:30px;list-style:none}
  .links li{animation:rise .7s .4s cubic-bezier(.2,.7,.2,1) both}

  /* botão de vidro arredondado, fosco */
  .btn{
    --g:0;
    position:relative;display:flex;align-items:center;justify-content:center;
    width:100%;min-height:56px;padding:14px 52px;
    color:#fff;text-decoration:none;font-size:15.5px;font-weight:500;letter-spacing:0;
    border-radius:999px;overflow:hidden;
    background:linear-gradient(180deg,rgba(176,186,235,calc(.30 + .10*var(--g))) 0%,rgba(140,152,215,calc(.24 + .10*var(--g))) 100%);
    border:1px solid rgba(255,255,255,calc(.10 + .35*var(--g)));
    backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:
      0 8px 24px rgba(0,0,0,.28),
      0 0 calc(36px*var(--g)) rgba(56,128,240,calc(.55*var(--g))),
      inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .3s cubic-bezier(.2,.7,.2,1),background .3s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn > span:first-child{position:relative;z-index:1}
  .btn .more{
    position:absolute;right:20px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:3px;opacity:.75;z-index:1;
  }
  .btn .more i{display:block;width:3px;height:3px;border-radius:50%;background:#fff}
  .btn:hover,.btn:focus-visible{
    transform:translateY(-2px);outline:none;
    background:linear-gradient(180deg,rgba(190,200,245,.40) 0%,rgba(150,165,225,.32) 100%);
  }
  .btn:active{transform:translateY(0) scale(.99)}

  footer{
    margin-top:auto;padding-top:40px;text-align:center;
    font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:rgba(143,163,199,.55);
    animation:rise .8s .8s cubic-bezier(.2,.7,.2,1) both;
  }

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}
  }
</style>
</head>

<script>
(function(){
  document.getElementById('y').textContent = new Date().getFullYear();

  var cv = document.getElementById('dot'), ctx = cv.getContext('2d');
  var logo = document.getElementById('logo'), btn = document.getElementById('btn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, DPR, path = [], total = 0;
  var BLUE = '56,128,240';

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    buildPath();
  }

  // curva fechada (Catmull-Rom) por pontos — amostrada por comprimento de arco
  function catmull(p0,p1,p2,p3,t){
    var t2=t*t,t3=t2*t;
    return {
      x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
      y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
    };
  }
  function buildPath(){
    var L = logo.getBoundingClientRect(), B = btn.getBoundingClientRect();
    var lx = L.left + L.width/2, ly = L.top + L.height/2;
    var bx = B.left + B.width/2, by = B.top + B.height/2;
    var side = Math.min(W/2 - 14, Math.max(L.width*.95, B.width/2 + 18));
    var midY = (L.bottom + B.top)/2;
    // percurso: atravessa a logo (esq→dir), desce pela direita, atravessa o botão (dir→esq), sobe pela esquerda
    var pts = [
      {x:lx - L.width*.62, y:ly + 6},
      {x:lx,               y:ly - L.height*.12},   // passa pelo centro da logo
      {x:lx + L.width*.62, y:ly + 6},
      {x:bx + side,        y:midY},
      {x:B.right - 30,     y:by},
      {x:bx,               y:by + 2},              // passa pelo botão
      {x:B.left + 30,      y:by},
      {x:bx - side,        y:midY}
    ];
    var raw = [], n = pts.length, i, s;
    for (i=0;i<n;i++) for (s=0;s<40;s++)
      raw.push(catmull(pts[(i-1+n)%n],pts[i],pts[(i+1)%n],pts[(i+2)%n],s/40));
    path = [{x:raw[0].x,y:raw[0].y,d:0}]; total = 0;
    for (i=1;i<=raw.length;i++){
      var a = raw[i-1], b = raw[i % raw.length];
      total += Math.hypot(b.x-a.x,b.y-a.y);
      path.push({x:b.x,y:b.y,d:total});
    }
  }
  function at(d){
    d = ((d % total) + total) % total;
    var lo = 0, hi = path.length-1;
    while (hi-lo > 1){ var m = (lo+hi)>>1; if (path[m].d <= d) lo = m; else hi = m; }
    var a = path[lo], b = path[hi], k = (d-a.d)/((b.d-a.d)||1);
    return {x:a.x+(b.x-a.x)*k, y:a.y+(b.y-a.y)*k};
  }

  function proximity(p, r, pad){
    var dx = Math.max(r.left - p.x, 0, p.x - r.right), dy = Math.max(r.top - p.y, 0, p.y - r.bottom);
    return Math.max(0, 1 - Math.hypot(dx,dy)/pad);
  }

  var dist = 0, last = performance.now(), gl = 0, gb = 0;
  function frame(now){
    var dt = Math.min(.05,(now-last)/1000); last = now;
    if (!reduce) dist += 150*dt;                         // velocidade (px/s)
    ctx.clearRect(0,0,W,H);
    if (total > 0){
      var p = at(dist);
      // o pontinho "acende" a logo e o botão quando passa por eles
      var L = logo.getBoundingClientRect(), B = btn.getBoundingClientRect();
      var tl = proximity(p, L, 110), tb = proximity(p, B, 90);
      gl += (tl - gl)*Math.min(1, dt*8); gb += (tb - gb)*Math.min(1, dt*8);
      logo.style.setProperty('--g', gl.toFixed(3));
      btn.style.setProperty('--g', gb.toFixed(3));

      ctx.globalCompositeOperation = 'lighter';
      // rastro
      for (var k = 26; k >= 1; k--){
        var q = at(dist - k*5), f = 1 - k/27;
        ctx.fillStyle = 'rgba('+BLUE+','+(.30*f*f).toFixed(3)+')';
        ctx.beginPath(); ctx.arc(q.x,q.y,2.6*f+.4,0,6.283); ctx.fill();
      }
      // brilho + núcleo
      var g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,20);
      g.addColorStop(0,'rgba('+BLUE+',.85)'); g.addColorStop(.35,'rgba('+BLUE+',.25)'); g.addColorStop(1,'rgba('+BLUE+',0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,20,0,6.283); ctx.fill();
      ctx.fillStyle = '#dbe9ff'; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,6.283); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('scroll', buildPath, {passive:true});
  window.addEventListener('load', function(){
    resize();
    // refaz o trajeto enquanto as animações de entrada terminam e a fonte carrega
    var n = 0, iv = setInterval(function(){ buildPath(); if (++n > 14) clearInterval(iv); }, 120);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildPath);
    dist = 0; last = performance.now(); requestAnimationFrame(frame);
  });
})();
</script>
